name: Aseprite Linux & Windows Build

on:
  push:
    branches: ["pro-version", "main"]

  workflow_dispatch:

permissions:
  contents: read

env:
  ASEPRITE_VERSION: "v1.3.17.2"
  SKIA_VERSION: "m124-08a5439a6b"

jobs:

  # ============================================================
  # WINDOWS x64
  # ============================================================
  build-windows:
    name: Build Aseprite - Windows x64
    runs-on: windows-2022

    steps:
      - name: Checkout Aseprite Source
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          ref: ${{ env.ASEPRITE_VERSION }}
          submodules: recursive
          fetch-depth: 1

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@master

      - name: Verify Build Tools
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          git --version

      - name: Download Skia
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\deps\skia" | Out-Null

          $url = "https://github.com/aseprite/skia/releases/download/$env:SKIA_VERSION/Skia-Windows-Release-x64.zip"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "$env:GITHUB_WORKSPACE\skia.zip"

      - name: Extract Skia
        shell: pwsh
        run: |
          Expand-Archive `
            -Path "$env:GITHUB_WORKSPACE\skia.zip" `
            -DestinationPath "$env:GITHUB_WORKSPACE\deps\skia" `
            -Force

          Remove-Item "$env:GITHUB_WORKSPACE\skia.zip"

      - name: Configure Aseprite
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          mkdir build
          cd build

          cmake ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DLAF_BACKEND=skia ^
            -DSKIA_DIR="%GITHUB_WORKSPACE%\deps\skia" ^
            -DSKIA_LIBRARY_DIR="%GITHUB_WORKSPACE%\deps\skia\out\Release-x64" ^
            -DSKIA_LIBRARY="%GITHUB_WORKSPACE%\deps\skia\out\Release-x64\skia.lib" ^
            -G Ninja ^
            ..

      - name: Build Aseprite
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=x64
          cd build
          ninja aseprite

      - name: Verify Windows Build
        shell: pwsh
        run: |
          if (!(Test-Path "build\bin\aseprite.exe")) {
            Write-Error "Aseprite executable was not produced."
            exit 1
          }

          Write-Host "Aseprite Windows build succeeded."

      - name: Package Windows Build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\package" | Out-Null

          Copy-Item `
            -Path "$env:GITHUB_WORKSPACE\build\bin\*" `
            -Destination "$env:GITHUB_WORKSPACE\package" `
            -Recurse `
            -Force

          Compress-Archive `
            -Path "$env:GITHUB_WORKSPACE\package\*" `
            -DestinationPath "$env:GITHUB_WORKSPACE\aseprite-windows-x64.zip" `
            -CompressionLevel Optimal

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-windows-x64
          path: aseprite-windows-x64.zip
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # LINUX x64
  # ============================================================
  build-linux:
    name: Build Aseprite - Linux x64
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Aseprite Source
        uses: actions/checkout@v4
        with:
          repository: aseprite/aseprite
          ref: ${{ env.ASEPRITE_VERSION }}
          submodules: recursive
          fetch-depth: 1

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            libx11-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libharfbuzz-dev \
            libwebp-dev \
            libcurl4-openssl-dev \
            unzip

      - name: Verify Build Tools
        run: |
          clang --version
          cmake --version
          ninja --version
          git --version

      - name: Download Skia
        run: |
          mkdir -p "$GITHUB_WORKSPACE/deps/skia"

          curl -L \
            "https://github.com/aseprite/skia/releases/download/${SKIA_VERSION}/Skia-Linux-Release-x64.zip" \
            -o "$GITHUB_WORKSPACE/skia.zip"

      - name: Extract Skia
        run: |
          unzip -q \
            "$GITHUB_WORKSPACE/skia.zip" \
            -d "$GITHUB_WORKSPACE/deps/skia"

          rm "$GITHUB_WORKSPACE/skia.zip"

      - name: Configure Aseprite
        working-directory: ${{ github.workspace }}
        env:
          CC: clang
          CXX: clang++
        run: |
          mkdir -p build
          cd build

          cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_CXX_FLAGS:STRING=-stdlib=libstdc++ \
            -DCMAKE_EXE_LINKER_FLAGS:STRING=-stdlib=libstdc++ \
            -DLAF_BACKEND=skia \
            -DSKIA_DIR="$GITHUB_WORKSPACE/deps/skia" \
            -DSKIA_LIBRARY_DIR="$GITHUB_WORKSPACE/deps/skia/out/Release-x64" \
            -DSKIA_LIBRARY="$GITHUB_WORKSPACE/deps/skia/out/Release-x64/libskia.a" \
            -G Ninja \
            ..

      - name: Build Aseprite
        working-directory: ${{ github.workspace }}/build
        run: |
          ninja aseprite

      - name: Verify Linux Build
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/build/bin/aseprite" ]; then
            echo "Aseprite executable was not produced."
            exit 1
          fi

          echo "Aseprite Linux build succeeded."

      - name: Package Linux Build
        run: |
          mkdir -p "$GITHUB_WORKSPACE/package"

          cp -r \
            "$GITHUB_WORKSPACE/build/bin/"* \
            "$GITHUB_WORKSPACE/package/"

          tar \
            -czf \
            "$GITHUB_WORKSPACE/aseprite-linux-x64.tar.gz" \
            -C "$GITHUB_WORKSPACE/package" \
            .

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aseprite-linux-x64
          path: aseprite-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 7


  # ============================================================
  # MEGA UPLOAD
  # ============================================================
  upload-mega:
    name: Upload Builds to MEGA
    runs-on: ubuntu-latest

    needs:
      - build-windows
      - build-linux

    steps:
      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: aseprite-windows-x64
          path: mega-upload/windows

      - name: Download Linux Build
        uses: actions/download-artifact@v4
        with:
          name: aseprite-linux-x64
          path: mega-upload/linux

      - name: Display Builds
        run: |
          echo "Files to be upload:"
          find mega-upload -type f -print

      - name: Upload Builds to MEGA
        uses: Difegue/action-megacmd@master
        with:
          args: put "mega-upload/*" "/Aseprite-Builds/"
        env:
          USERNAME: ${{ secrets.MEGA_USERNAME }}
          PASSWORD: ${{ secrets.MEGA_PASSWORD }}
